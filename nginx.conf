worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # The runtime filesystem is read-only and Nginx runs without root. Any
    # request buffering therefore belongs in the small, disposable /tmp mount.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /dev/stdout main;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # Docusaurus emits extensionless links while the generated files use
        # .html. Directory indexes cover routes that Docusaurus emits as
        # folders, so both output styles work without redirects.
        location / {
            add_header Cache-Control "no-cache";
            try_files $uri $uri.html $uri/ =404;
        }

        # Docusaurus fingerprints compiled assets, so these can be cached for
        # a year without making documentation changes appear stale.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }
    }
}
